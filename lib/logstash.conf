input {
  tcp {
    port => 5044
    codec => json {
      target => "log_data"
    }
  }
}

filter {
  mutate { 
    lowercase => [ "[log_data][level]" ]  
  }
  
  mutate { add_field => { "[@metadata][target_index]" => "my_app_log" } }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "%{[@metadata][target_index]}"
  }
}
